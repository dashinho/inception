version: '3'

services:
  # ========================================= #
  #                 MARIADB                   #
  # ========================================= #
  mariadb:
    build: 
      context: ./requirements/mariadb
      dockerfile: Dockerfile
    container_name: mariadb
    image: mariadb
    env_file: .env
    restart: always
    networks:
      - inception_network
    volumes:
      - mariadb_data:/var/lib/mysql

  # ========================================= #
  #                WORDPRESS                  #
  # ========================================= #
  wordpress:
    build: 
      context: ./requirements/wordpress
      dockerfile: Dockerfile
    container_name: wordpress
    image: wordpress
    env_file: .env
    restart: always
    depends_on:
      - mariadb
    networks:
      - inception_network
    volumes:
      - wordpress_data:/var/www/html

  # ========================================= #
  #                  NGINX                    #
  # ========================================= #
  nginx:
    build: 
      context: ./requirements/nginx
      dockerfile: Dockerfile
    container_name: nginx
    image: nginx
    env_file: .env
    restart: always
    depends_on:
      - wordpress
    ports:
      - "443:443"
    networks:
      - inception_network
    volumes:
      - wordpress_data:/var/www/html

# ========================================= #
#                 NETWORKS                  #
# ========================================= #
networks:
  inception_network:
    driver: bridge
    name: inception_network

# ========================================= #
#                 VOLUMES                   #
# ========================================= #
volumes:
  mariadb_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/dash/data/mariadb

  wordpress_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/dash/data/wordpress