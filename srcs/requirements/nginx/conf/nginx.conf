server {
    # Listen ONLY on port 443 for HTTPS traffic
    listen 443 ssl;
    listen [::]:443 ssl;

    # The domain name mandated by the subject (will be replaced via script or env)
    server_name ${DOMAIN_NAME};

    # The location of the SSL certificates generated by our setup script
    ssl_certificate /etc/ssl/certs/nginx-selfsigned.crt;
    ssl_certificate_key /etc/ssl/private/nginx-selfsigned.key;

    # STRICT RULE: Use ONLY TLSv1.2 and TLSv1.3
    ssl_protocols TLSv1.2 TLSv1.3;

    # Define the root directory where the WordPress files will be mounted
    root /var/www/html;
    
    # Specify the default index files
    index index.php index.html index.htm;

    # Route all requests. If the file doesn't exist, pass it to WordPress's index.php
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # Route all PHP requests to the WordPress container's PHP-FPM service
    location ~ \.php$ {
        # Split the URI for fastcgi to process
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        
        # Route to the 'wordpress' container on port 9000
        fastcgi_pass wordpress:9000;
        
        # Standard fastcgi configurations
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }
}